name: Build and publish test plugin

on:
  push:
    branches: [main]
    paths:
      - "PartyPlayChecker-source.zip"
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Extract plugin source
        shell: pwsh
        run: Expand-Archive -LiteralPath .\PartyPlayChecker-source.zip -DestinationPath .\source -Force

      - name: Build Release x64
        shell: pwsh
        run: msbuild .\source\PartyPlayChecker.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Package and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sourceRoot = Join-Path $PWD "source"
          $cppPath = Join-Path $sourceRoot "Plugins/PartyPlayChecker/src/PartyPlayChecker.cpp"
          $sourceText = Get-Content -LiteralPath $cppPath -Raw
          $match = [regex]::Match($sourceText, 'POEFIXER_PLUGIN_INFO\(\s*"PartyPlayChecker"\s*,\s*"[^"]+"\s*,\s*"(?<version>\d+\.\d+\.\d+)"')
          if (!$match.Success) { throw "Could not read the plugin version from POEFIXER_PLUGIN_INFO." }
          $version = $match.Groups["version"].Value
          $tag = "v$version"

          $dllPath = Join-Path $sourceRoot "x64/Release/Plugins/PartyPlayChecker/PartyPlayChecker.dll"
          if (!(Test-Path -LiteralPath $dllPath)) { throw "The build did not produce PartyPlayChecker.dll." }

          $stageRoot = Join-Path $env:RUNNER_TEMP "PartyPlayChecker-package"
          $pluginFolder = Join-Path $stageRoot "Plugins/PartyPlayChecker"
          New-Item -ItemType Directory -Force -Path $pluginFolder | Out-Null
          Copy-Item -LiteralPath $dllPath -Destination $pluginFolder

          $assetPath = Join-Path $env:RUNNER_TEMP "PartyPlayChecker.zip"
          Compress-Archive -Path (Join-Path $stageRoot "*") -DestinationPath $assetPath -Force

          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $assetPath --title "PartyPlayChecker $tag" --notes "- First test build.\n- The displayed distance is rounded to 0.1 m.\n- The 13 m starting threshold is provisional for PoE 2 and can be changed in the plugin settings."
          } else {
            gh release upload $tag $assetPath --clobber
          }
